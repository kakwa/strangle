# strangle configuration for the home.tf Ansible project.
# Point strangle at the ansible directory and it will apply the configured
# playbooks on the interval, recording every run in PostgreSQL.
#
#   STRANGLE_CONFIG=strangle-home.yaml STRANGLE_DSN='postgres://kakwa:...@127.0.0.1:5432/strangle' strangle

working_dir: /home/kakwa/Geek/GitHub/home.tf/ansible
inventory: inventory
playbooks:
  - hypervisor.yml
  - ai.yml
  - infra-dns.yml
  - infra-ldap.yml
  - infra-ansible-master.yml
  # - utility.yml   # the `utility` host is intentionally not in the inventory

# interval defaults to 15m; override with STRANGLE_INTERVAL.

# The DSN can be set here or with the STRANGLE_DSN environment variable
# (the environment variable wins). Without a DSN strangle falls back to an
# in-memory store and history is lost on restart.
database:
  dsn: postgres://kakwa:kakwa@127.0.0.1:5432/strangle

# The playbooks run as `kakwa` (ansible_user in the inventory) and escalate
# with `become: true` inside the plays, so no -b flags are needed here.
