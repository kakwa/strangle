# Test configuration for the Go-managed SSH transport: run this playbook
# with a target whose inventory marks the host
# ansible_connection=strangle_ssh (see inventory.ini in this directory).
---
- name: Strangle SSH demo
  hosts: remote
  become: true
  gather_facts: false
  tasks:
    - name: Show remote user
      ansible.builtin.command: whoami
      register: who_result

    - name: Report remote user
      ansible.builtin.debug:
        msg: "connected as {{ who_result.stdout }}"
