name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      STRANGLE_TEST_DSN: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python development headers and Ansible
        run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config ansible

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Coverage
        run: make coverage

      - name: Build
        run: make build

  ui:
    name: Web UI
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      # The e2e suite serves the production build (dist/) through a mock
      # API server (cypress/support/mock-server.mjs), so it must run after
      # the build and needs no other services.
      - name: E2E (Cypress)
        run: npm run test:e2e
