# Sample per-target configuration (strangle.yml).
#
# This is a reference example. Every target listed in collection.yml carries
# its own strangle.yml at the root of its project directory — that live file
# is what strangle actually reads. Copy this file into a target directory and
# adjust it for that project.

# The named jobs to run, in order. Each job has its own playbook, inventory
# and options. Relative paths resolve against working_dir.
#
# Options given here at the top level are defaults; a job's own `options`
# overrides them field by field.
#
# options:
#   user: kakwa
#   become: true
#
# Schedules are per job (or per target here as a default). Use a duration
# (`interval: 30m`), a five-field cron expression (`schedule: "0 3 * * 1"`),
# an alias (`schedule: "@daily"`) or `schedule: "@off"` for manual-only jobs.
# A job without one inherits server.yml's `interval` and runs at startup.
# schedule: "*/5 * * * *"

playbooks:
  - name: hypervisors
    playbook: ./hypervisor.yml
    inventory: ./inventory/hypervisor.yml
    # schedule: "0 3 * * 1"   # overrides the target-level schedule above
    options:
      user: kakwa
      become: true
  - name: base_infra
    playbook: ./infra.yml
    inventory: ./inventory/infra.yml
    options:
      user: kakwa
      become: true
  - name: ai_inference
    playbook: ./ai.yml
    inventory: ./inventory/ai.yml
    options:
      user: kakwa
      become: true

# The directory the playbooks run from: Ansible resolves ansible.cfg,
# relative paths and roles relative to it. Defaults to the target path.
# working_dir: playbooks

# Options accepted inside a job's (or the top-level) `options` block:
#
#   user: deploy             # -u; also the SSH transport's fallback user
#   become: true             # -b
#   become_method: sudo      # --become-method (Ansible default: sudo)
#   become_user: root        # --become-user
#
# Passwords are given as files: an embedded interpreter cannot answer
# interactive -k/-K prompts. These map to Ansible's password-file flags.
#   become_password_file: /run/secrets/ansible_become
#   connection_password_file: /run/secrets/ansible_connection
#   vault_password_file: /run/secrets/ansible_vault
#
# Optional Go-managed SSH transport (persistent connections, no ssh process).
# The default host_key_policy is api; see the README for the full option set.
#   ssh:
#     enabled: true
#     private_key_file: ~/.ssh/id_ed25519
#     use_agent: true
#     host_key_policy: api
#
# Short-lived SSH user certificates (requires private_key_file, ignores
# use_agent and an adjacent -cert.pub). See docs/ssh-transport.md:
#   certificate:
#     backend: internal        # or vault
#     ttl: 10m
#     principals: [deploy]
#     internal:
#       ca_key_file: /run/secrets/ssh_ca_key
#   # For Vault, use instead:
#   #   backend: vault
#   #   vault:
#   #     addr: https://vault.example.com
#   #     role: strangle
#   #     role_id_file: /run/secrets/vault_role_id
#   #     secret_id_file: /run/secrets/vault_secret_id
