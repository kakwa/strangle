# The Ansible projects (targets) strangle applies (collection.yml).
# Loaded by default (override with -c).
#
# Each entry names a target and points at the directory of an Ansible
# project, which must contain its own strangle.yml with the project's
# playbooks, inventory and SSH settings. Relative paths resolve against this
# file's directory. Targets run in list order, serialized through the single
# embedded interpreter.

targets:
  # Local demo: a playbook against localhost, defined in the demo/ directory.
  - name: demo
    path: ../demo

  # The home.tf Ansible project.
  - name: home
    path: /home/kakwa/Geek/GitHub/home.tf/ansible
    # Git upstream. Placeholder: parsed but not used yet.
