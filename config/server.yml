# Base server configuration for strangle (server.yml).
# Loaded by default (override with -s). Holds process-level settings only.

# HTTP listen address. Defaults to :8080.
listen_addr: ":8080"

# Log level: debug, info, warn or error. Defaults to info.
log_level: info

# How often a full cycle over every target is run. Defaults to 15m.
interval: 2m

# PostgreSQL DSN for run history. Without a DSN strangle falls back to an
# in-memory store and history is lost on restart.
database:
  dsn: postgres://postgres@127.0.0.1:5432/strangle

# How many worker child processes to spawn for running playbooks. Each worker
# owns one embedded Ansible interpreter; runs on one worker are serialized,
# so more workers allow more concurrent runs. Defaults to 1.
workers: 2

# Webhook token for the git-collection sync endpoint. When set, POST /api/sync
# (without a UI session) requires the token: `Authorization: Bearer <token>`
# or the `X-Strangle-Token` header.
#
# UI authentication is a separate mechanism with no flag: it is on as soon as
# at least one local account exists. Accounts live in the database above:
#   strangle user add <name> --password-stdin
# auth:
#   token: change-me

# Landlock sandboxing between collections. When enabled, each collection gets
# its own workers: its checkout is read-only and Ansible writes go to a
# private scratch directory. See docs/configuration.md.
# sandbox:
#   enabled: true
#   # Optional extra paths shared by all sandboxed workers:
#   # read_only:
#   #   - /usr/local/share/roles
#   # writable:
#   #   - /var/cache/strangle
