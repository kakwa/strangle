# Base configuration for strangle.
# The path to this file can be overridden with STRANGLE_CONFIG.

# Required: the playbooks to run, in order (relative to working_dir if set).
playbooks:
  - playbook.yml

# Legacy single-playbook form (equivalent to playbooks: [playbook.yml]):
# playbook: playbook.yml

# Required: inventory file or directory (relative to working_dir if set).
inventory: inventory.ini

# The directory the playbooks run from: Ansible resolves ansible.cfg,
# relative paths and roles relative to it (optional).
# working_dir: /path/to/ansible

# Optional: connect to hosts as this user (-u).
# user: deploy

# Optional privilege escalation (-b / --become-method / --become-user).
become: false
become_method: sudo
# become_user: root

# Passwords are given as files: an embedded interpreter cannot answer
# interactive -k/-K prompts. These map to Ansible's password-file flags.
# become_password_file: /run/secrets/ansible_become
# connection_password_file: /run/secrets/ansible_connection
# vault_password_file: /run/secrets/ansible_vault

# Optional: Go-managed SSH transport (persistent connections, no ssh process).
# See strangle-remote.yaml for a working example.
# ssh:
#   enabled: true
#   user: deploy
#   private_key_file: ~/.ssh/id_ed25519
#   use_agent: true
#   host_key_policy: api  # api | known_hosts | ca | auto | insecure
